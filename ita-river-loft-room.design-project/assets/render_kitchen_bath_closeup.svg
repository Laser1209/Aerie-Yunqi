<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" style="background:#F5F0EB;">
<defs>
  <linearGradient id="wallKB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FAFAFA"/><stop offset="100%" stop-color="#F0F0F0"/></linearGradient>
  <linearGradient id="floorKB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8C0B8"/><stop offset="100%" stop-color="#A8A098"/></linearGradient>
  <linearGradient id="cabKB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F0F0"/><stop offset="100%" stop-color="#D0D0D0"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B8986A"/><stop offset="100%" stop-color="#8B7355"/></linearGradient>
  <filter id="shKB"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="2" dy="3" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Title -->
<text x="700" y="45" font-size="26" fill="#1A1A1E" text-anchor="middle" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">北侧服务带 · L型厨房+中岛 + 干湿分离客卫家政</text>
<text x="700" y="70" font-size="12" fill="#6D717D" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管井集中于北侧背江面 · 不占江景面 · 双开门冰箱 · 洗衣塔</text>

<!-- Wall and floor -->
<rect x="0" y="0" width="1400" height="580" fill="url(#wallKB)"/>
<polygon points="0,580 1400,580 1400,900 0,900" fill="url(#floorKB)"/>
<!-- Tile grout -->
<g stroke="#999" stroke-width="0.5" opacity="0.4">
  <line x1="0" y1="640" x2="1400" y2="640"/><line x1="0" y1="700" x2="1400" y2="700"/><line x1="0" y1="760" x2="1400" y2="760"/><line x1="0" y1="820" x2="1400" y2="820"/><line x1="0" y1="880" x2="1400" y2="880"/>
</g>

<!-- Kitchen L-cabinet (north wall) -->
<rect x="100" y="120" width="700" height="60" fill="url(#cabKB)" stroke="#888" stroke-width="2" rx="2" filter="url(#shKB)"/>
<!-- Upper cabinets -->
<rect x="100" y="80" width="500" height="35" fill="url(#cabKB)" stroke="#888" stroke-width="1.5" rx="2"/>
<!-- Counter top -->
<rect x="95" y="115" width="710" height="8" fill="#4A4A4A"/>
<!-- Cabinet doors -->
<g stroke="#AAA" stroke-width="1">
  <line x1="220" y1="120" x2="220" y2="180"/><line x1="340" y1="120" x2="340" y2="180"/><line x1="460" y1="120" x2="460" y2="180"/><line x1="580" y1="120" x2="580" y2="180"/>
  <line x1="200" y1="80" x2="200" y2="115"/><line x1="320" y1="80" x2="320" y2="115"/><line x1="440" y1="80" x2="440" y2="115"/>
</g>
<!-- Handles -->
<g fill="#888">
  <circle cx="218" cy="150" r="1.5"/><circle cx="338" cy="150" r="1.5"/><circle cx="458" cy="150" r="1.5"/><circle cx="578" cy="150" r="1.5"/>
</g>
<text x="450" y="210" font-size="11" fill="#555" text-anchor="middle" font-family="'PingFang SC',sans-serif">L型橱柜（北向/西向）</text>

<!-- Kitchen L-cabinet (west wall return) -->
<rect x="100" y="180" width="60" height="350" fill="url(#cabKB)" stroke="#888" stroke-width="2" rx="2" filter="url(#shKB)"/>
<rect x="100" y="180" width="35" height="350" fill="url(#cabKB)" stroke="#888" stroke-width="1.5"/>
<g stroke="#AAA" stroke-width="1"><line x1="100" y1="250" x2="160" y2="250"/><line x1="100" y1="320" x2="160" y2="320"/><line x1="100" y1="390" x2="160" y2="390"/><line x1="100" y1="460" x2="160" y2="460"/></g>

<!-- Kitchen island -->
<rect x="280" y="250" width="280" height="100" fill="url(#wood)" stroke="#5A4A3A" stroke-width="2" rx="4" filter="url(#shKB)"/>
<rect x="285" y="245" width="270" height="10" fill="#D4B896"/>
<!-- Island bar stools -->
<g fill="#E8E5E0" stroke="#888" stroke-width="1">
  <rect x="310" y="360" width="30" height="30" rx="6"/><rect x="400" y="360" width="30" height="30" rx="6"/><rect x="490" y="360" width="30" height="30" rx="6"/>
</g>
<text x="420" y="410" font-size="11" fill="#5A4A3A" text-anchor="middle" font-family="'PingFang SC',sans-serif">厨房中岛 · 吧台简餐位</text>

<!-- Double door fridge (user's favorite drinks) -->
<rect x="820" y="140" width="100" height="180" fill="#E0E0E0" stroke="#4A4A4A" stroke-width="2" rx="3" filter="url(#shKB)"/>
<line x1="870" y1="140" x2="870" y2="320" stroke="#4A4A4A" stroke-width="1"/>
<circle cx="868" cy="200" r="2" fill="#888"/><circle cx="872" cy="200" r="2" fill="#888"/>
<!-- Contents visible through glass? -->
<rect x="830" y="150" width="35" height="70" fill="rgba(200,230,255,0.2)" stroke="#888" stroke-width="0.5"/>
<circle cx="840" cy="170" r="5" fill="#FF8A80" opacity="0.6"/><circle cx="855" cy="180" r="5" fill="#FFD166" opacity="0.6"/>
<rect x="875" y="150" width="35" height="70" fill="rgba(200,230,255,0.2)" stroke="#888" stroke-width="0.5"/>
<text x="870" y="340" font-size="10" fill="#4A4A4A" text-anchor="middle" font-family="'PingFang SC',sans-serif">双开门冰箱</text>
<text x="870" y="355" font-size="8" fill="#FF8A80" text-anchor="middle" font-family="'PingFang SC',sans-serif">用户爱喝的饮料</text>

<!-- Cooktop/hob on counter -->
<rect x="250" y="125" width="80" height="50" fill="#2A2A2E" rx="2"/>
<circle cx="270" cy="150" r="8" fill="#1A1A1E"/><circle cx="310" cy="150" r="8" fill="#1A1A1E"/>
<!-- Range hood -->
<rect x="250" y="60" width="80" height="20" fill="#888" rx="2"/>

<!-- Sink -->
<rect x="450" y="125" width="60" height="40" fill="#B8D0E8" rx="3" stroke="#666"/>
<circle cx="465" cy="145" r="4" fill="#888"/><circle cx="495" cy="145" r="4" fill="#888"/>

<!-- Bathroom/Laundry section -->
<!-- Bathroom walls (northeast) -->
<rect x="950" y="120" width="4" height="460" fill="#888"/>
<rect x="950" y="300" width="350" height="4" fill="#888"/>
<text x="1125" y="100" font-size="12" fill="#555" text-anchor="middle" font-weight="600" font-family="'PingFang SC',sans-serif">客卫（干湿分离）+ 洗衣家政区</text>

<!-- Wet area (shower + toilet) -->
<rect x="960" y="310" width="160" height="260" fill="#E8F0F8" stroke="#888" stroke-width="1" rx="2"/>
<!-- Toilet -->
<ellipse cx="1000" cy="520" rx="20" ry="25" fill="#FFF" stroke="#888" stroke-width="1.5"/>
<rect x="985" y="490" width="30" height="20" fill="#FFF" stroke="#888" stroke-width="1.5" rx="4"/>
<text x="1000" y="565" font-size="9" fill="#666" text-anchor="middle" font-family="'PingFang SC',sans-serif">坐便器</text>
<!-- Shower enclosure -->
<rect x="1040" y="320" width="70" height="120" fill="rgba(200,230,255,0.3)" stroke="#4A90D9" stroke-width="1.5" rx="2"/>
<line x1="1040" y1="380" x2="1110" y2="380" stroke="#4A90D9" stroke-width="1" stroke-dasharray="3,2"/>
<circle cx="1080" cy="340" r="12" fill="#CCC" stroke="#888"/>
<text x="1075" y="460" font-size="9" fill="#4A90D9" text-anchor="middle" font-family="'PingFang SC',sans-serif">淋浴区</text>

<!-- Dry vanity area -->
<rect x="960" y="130" width="330" height="160" fill="#F0E8DF" stroke="#888" stroke-width="1" rx="2"/>
<rect x="1000" y="200" width="120" height="50" fill="url(#wood)" stroke="#5A4A3A" stroke-width="1.5" rx="2"/>
<rect x="1010" y="180" width="100" height="25" fill="#FFF" stroke="#888" stroke-width="1" rx="12"/>
<!-- Blue toothbrush cup (user's) -->
<rect x="1020" y="160" width="18" height="20" fill="#4A90D9" stroke="#2A5A8A" stroke-width="1" rx="2"/>
<line x1="1025" y1="155" x2="1025" y2="160" stroke="#FFF" stroke-width="1"/><line x1="1030" y1="155" x2="1030" y2="160" stroke="#FFF" stroke-width="1"/>
<text x="1030" y="150" font-size="8" fill="#4A90D9" font-family="'PingFang SC',sans-serif">蓝色牙刷杯</text>
<text x="1060" y="275" font-size="10" fill="#5A4A3A" text-anchor="middle" font-family="'PingFang SC',sans-serif">洗手台（干区）</text>

<!-- Laundry tower -->
<rect x="1200" y="150" width="80" height="80" fill="#E0E0E0" stroke="#4A4A4A" stroke-width="2" rx="3" filter="url(#shKB)"/>
<rect x="1200" y="230" width="80" height="80" fill="#E0E0E0" stroke="#4A4A4A" stroke-width="2" rx="3"/>
<circle cx="1240" cy="190" r="15" fill="none" stroke="#4A4A4A" stroke-width="2"/>
<circle cx="1240" cy="270" r="15" fill="none" stroke="#4A4A4A" stroke-width="2"/>
<text x="1240" y="330" font-size="9" fill="#4A4A4A" text-anchor="middle" font-family="'PingFang SC',sans-serif">洗衣塔</text>
<text x="1240" y="345" font-size="8" fill="#666" text-anchor="middle" font-family="'PingFang SC',sans-serif">洗烘叠放</text>

<!-- Utility/storage closet -->
<rect x="1290" y="150" width="50" height="160" fill="url(#cabKB)" stroke="#888" stroke-width="1.5" rx="2"/>
<line x1="1315" y1="150" x2="1315" y2="310" stroke="#AAA" stroke-width="1"/>
<text x="1315" y="330" font-size="9" fill="#666" text-anchor="middle" font-family="'PingFang SC',sans-serif">家政柜</text>

<!-- Sliding door between kitchen and bath zone -->
<line x1="948" y1="310" x2="948" y2="480" stroke="#888" stroke-width="2"/>
<rect x="935" y="330" width="13" height="60" fill="none" stroke="#888" stroke-width="1.5"/>
<rect x="920" y="340" width="13" height="60" fill="none" stroke="#888" stroke-width="1.5"/>
<text x="925" y="415" font-size="8" fill="#666" text-anchor="end" font-family="'PingFang SC',sans-serif">推拉门</text>

<!-- Pipe shaft indication -->
<rect x="930" y="120" width="20" height="180" fill="url(#wallKB)" stroke="#DDD" stroke-width="1" stroke-dasharray="2,2"/>
<text x="940" y="110" font-size="8" fill="#999" text-anchor="middle" font-family="'PingFang SC',sans-serif">管井</text>

</svg>