# Aerie · 云栖 v0.1.0-beta.1 — Proactive Push (Auto-Wake) Configuration
# All comments are in English. This file is the source of truth for
# PushPolicy + CronScheduler.

proactive:
  enabled: true                            # Global kill-switch
  max_per_day: 5                           # v2 soft-budget base (advisory target)
  min_interval_min: 30                     # Min minutes between any two pushes
  state_path: "proactive_policy_state.json" # Persist Phase 08 policy state under AERIE_DATA_DIR/data
  quiet_start: "23:30"                     # Quiet period start (HH:MM)
  quiet_end: "07:00"                       # Quiet period end (HH:MM)
  exempt_scenes:                           # Scenes that bypass quiet period
    - morning_brief
    - goodnight
    - anniversary
  timezone: "Asia/Shanghai"

  # ── 阶段 5：行为层采样参数（ProactiveJudge 用；唯一映射见 core/behavior_sampler.py）──
  # p = p_floor + (p_ceiling - p_floor) * sigmoid((score - 参考分) / tau)
  # tau 越小越接近硬阈值、越大越随机；全部前端可调，改后 reload_config 热加载。
  judge_sampling:
    tau: 8                          # score 维度温度（0-100 分制）
    p_floor: 0.02                   # 概率下限（>0：低分仍有非零概率，杜绝硬闸门）
    p_ceiling: 0.95                 # 概率上限（<1：高分仍保留未发射样本）

  # ── v2: soft budget + hard-cap fuse + candidate pool + routine learning ──
  soft_budget: 0                           # 0 = fall back to max_per_day (advisory)
  hard_cap: 0                              # 0 = auto: max(max_per_day*1.5, 20)
  candidate_pool: true                     # generate_push returns ranked candidates, pick #1
  routine:
    enabled: true                          # RoutineLearner near-7d wake/sleep learning
    window_days: 7
    min_msgs_per_day: 3
    min_span_hours: 8

# Each scene defines a Cron schedule (or event trigger), a template,
# and a mood_aware flag for Brain.generate_push.
scenes:
  morning_brief:
    template: "早安。{weather}今天{date}。"
    cron: "30 6,7 * * *"
    mood_aware: true
    exempt_quiet: true
    anchor: "wake"                         # v2: 跟随作息学习搬移（起床时刻+15min）

  # Block-4A R1.5: 9am dedicated daily brief (custom_dispatcher=brief).
  # Runs brief_fetcher + compose_brief, emits "brief:show" SSE event.
  morning_brief_9am:
    custom_dispatcher: "brief"
    cron: "0 9 * * *"
    mood_aware: false
    exempt_quiet: true

  # Block-4B R2.2: desire-driven short text triggers (24h polling).
  # Reroute idle_care to use the desire engine when a desire instance
  # is alive; falls back to old trigger-based path otherwise.
  idle_care:
    template: "在干嘛。"
    trigger: "user_idle_4h"
    custom_dispatcher: "desire_care"
    mood_aware: true
    exempt_quiet: false

  voice_miss:
    template: "想听你声音。"
    trigger: "desire_voice"
    custom_dispatcher: "desire_voice"
    mood_aware: true
    exempt_quiet: false

  # R7.5+: 应用启动后主动 QQ 推送。exempt_quiet=true (忽略静默时段),
  # 不依赖 cron 触发,由 companion._boot_qq_greeting 在 start() 时调用。
  # judge_override 让 ProactiveJudge 强制放行,同时保持屏幕隔空人设。
  # R8.1+: force=true 让 push_scheduler 跳过 ProactiveJudge + PushPolicy
  # 抑制,确保每次启动都发。flag 60s 窗口防快速重启刷屏。
  boot_greeting:
    # R8.2+: 运行时由 companion._boot_qq_greeting 按时段生成通用问候,
    # 并注入当天真实待办数 / 天气作为上下文后交给 LLM 润色。
    # 此处仅作静态参考, 实际发送内容以运行时模板为准。
    template: "早安宝贝，今天{date}，你还有{todo_count}件事待办，{weather}。"
    custom_dispatcher: "boot_greeting"
    mood_aware: true
    exempt_quiet: true
    force: true

  weather_push:
    template: "{city}今天{weather}，{temp}度。{suggestion}。"
    cron: "0 7 * * *"
    mood_aware: false
    exempt_quiet: false

  lunch_remind:
    template: "吃饭。"
    cron: "30 11,12 * * *"
    mood_aware: true
    exempt_quiet: false

  evening_check:
    template: "今天怎么样。"
    cron: "30 17,18 * * *"
    mood_aware: true
    exempt_quiet: false

  goodnight:
    template: "睡吧。"
    cron: "30 22,23 * * *"
    mood_aware: true
    exempt_quiet: true
    anchor: "sleep"                        # v2: 跟随作息学习入睡窗口（入睡-45min）

  todo_remind:
    template: "{todo_count}件事没做。"
    cron: "0 9-21 * * *"
    mood_aware: false
    exempt_quiet: false

  anniversary:
    template: "今天{anniversary_name}。{days}天了。"
    cron: "0 0 * * *"
    mood_aware: true
    exempt_quiet: true

  emotion_comfort:
    template: "……{comfort_word}。"
    trigger: "cumulative_threshold_break"
    mood_aware: true
    exempt_quiet: false

  # ── 阶段 5：话题复现触发源 ──────────────────────────────────────────────
  # 从阶段 4 的 dormant 话题池做「候选召回」，再由 m 得出概率 p、采样决定是否发射：
  #   m = 兴趣评分^w_i × 沉寂时长^w_d × 上下文相关度^w_c（各因子归一化 0..1，权重和为 1）
  # defer_sampling=true：ProactiveJudge 只做硬闸门（防撞车/冷却），采样在本 scene 的
  # 分派分支内单点完成，保证同一决策链只有一个采样点。所有数值前端可调 + 热加载。
  topic_resurface:
    template: "想起你之前说的事，后来怎么样了？"
    cron: "*/15 * * * *"           # 每 15 分钟自检一次（真正发射受频控/额度约束）
    custom_dispatcher: "topic_resurface"
    mood_aware: true
    exempt_quiet: false
    enabled: true
    defer_sampling: true
    self_initiated: true            # AI 自发起：落库标记，区别于场景定时
    # m 的三因子权重（须和为 1；加权几何平均）
    interest_weight: 0.4
    dormancy_weight: 0.35
    context_weight: 0.25
    dormancy_cap_hours: 168         # 沉寂时长归一化上限（7 天，超出即视为“足够久”）
    relevance_default: 0.5          # 无参考上下文时的中性相关度（>= 召回门槛）
    context_candidate_floor: 0.15   # 阶段一候选召回门槛（低门槛、广撒网）
    # 概率映射：p = p_floor + (p_ceiling - p_floor) * sigmoid((m - m_midpoint)/tau)
    tau: 0.25                       # 采样温度 τ（越小越贪心）
    m_midpoint: 0.5                 # 概率拐点
    p_floor: 0.02                   # 低 m 概率下限（>0：低 m 不被饿死）
    p_ceiling: 0.9                  # 高 m 概率上限（<1：高 m 也保留未发射样本）
    # 低 m 单独子额度：高 m 用主额度、低 m 用子额度，互不挤占（前端可调）
    low_m_threshold: 0.5            # m < 该值判为低 m
    main_budget: 4                  # 主额度（高 m）
    low_m_budget: 1                 # 低 m 子额度
    replay_days: 7                  # 基线回放天数 N

