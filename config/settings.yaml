agent:
  max_segments_per_turn: 3
  progress:
    max_messages: 4
    style: stage
  workspace_default_roots:
  - D:\AerieOffice
brief_subscriptions:
  enabled: true
  sources:
    astronomy:
      enabled: true
    github_trending:
      enabled: true
      min_stars: 1000
browser:
  # 浏览器工具的来源：
  #   auto      （默认）= 装了 browser 功能包就让位给包；没装则用内置 webbridge
  #   playwright        = 只用功能包（没装包就没有 browser_* 工具）
  #   webbridge         = 只用内置通道（调外部 Kimi WebBridge 进程）
  # 注意 ToolRegistry.register 是覆盖语义、且核心在功能包之后注册，
  # 核心若无条件注册会顶掉功能包的同名工具；auto 就是为这件事设的。
  backend: auto
computer_control:
  blacklist: []
  custom_rules: {}
  mode: full
  whitelist: []
douyin:
  api_base_url: https://api.justoneapi.com
  api_token: ''
feature_flags:
  chat_request_queue_v1: true
  chat_stream_v1: true
  context_budget_v1: true
  conversation_model_v1: true
  identity_contract_v1: true
  ilink_pairing_v1: true
  image_assets_v1: true
  image_edit_v1: true
  image_life_recording_v1: true
  memory_write_validation_v1: true
  migration_framework_v1: true
  mobile_gateway_v1: true
  multi_channel_identity_v1: true
  persona_hub_source_v1: true
  proactive_delivery_v2: true
  promise_beats_v1: true
  recall_llm_instruction_v1: true
  self_evolve_l4_enabled: true
  thinking_trace_injection_v1: true
  topic_lifecycle_v1: true
  world_image_candidates_v1: true
  world_inprocess_v1: true
  world_sidecar_v1: true
  write_approval_v1: true
message_batching:
  base_interval_seconds: 0.5
  chars_per_second: 4
  enabled: true
  first_message_cap_seconds: 8
  first_message_idle_seconds: 3
  max_batch_size: 5
  max_interval_seconds: 5.0
  min_interval_seconds: 0.3
  window_seconds: 1.5
office:
  dir: F:\文件\Aerie
  first_run_prompted: true
  write_approval_timeout_sec: 60
proactive:
  auto_recent_window_min: 30
  companion_image_probability: 0.8
  enabled: true
  image_max_per_day: 0
  max_per_day: 0
  min_interval_min: 15
  outdoor_holiday_event: true
  outdoor_probability: 0.5
  outdoor_weather_event: true
  photo_min_interval_sec: 0
  primary_channel: desktop
  system_notifications: true
promise_beats:
  max_delay_min: 180
  max_pending: 2
  min_delay_min: 60
  poll_sec: 60
qq:
  heartbeat_interval: 30
  heartbeat_timeout: 10
  push_pause_when_offline: true
  startup_wait_timeout: 1.0
startup:
  auto_start: false
  start_minimized: false
theme:
  current: yita-pink
thinking_loop:
  enabled: false
  interval_seconds: 900
  max_steps_per_day: 24
  max_steps_per_hour: 4
  max_tokens_per_day: 100000
  step_timeout_seconds: 120
verify_batch4:
  ping: pong
  ts: 1784404889
weather:
  city: 济南
world:
  location: 济南
  random_events_per_day: 3
  reality_refresh_sec: 1800
  tick_interval_sec: 300
