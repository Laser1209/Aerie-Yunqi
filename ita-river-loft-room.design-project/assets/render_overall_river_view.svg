<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" style="background:linear-gradient(180deg,#87CEEB 0%,#B0E0E6 30%,#E0F0FF 50%,#F5F5F5 100%);">
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5B9BD5"/>
    <stop offset="40%" stop-color="#9DC3E6"/>
    <stop offset="100%" stop-color="#E8F4FC"/>
  </linearGradient>
  <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4A90D9"/>
    <stop offset="100%" stop-color="#2A5A8A"/>
  </linearGradient>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D4B896"/>
    <stop offset="100%" stop-color="#B8986A"/>
  </linearGradient>
  <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="rgba(200,230,255,0.3)"/>
    <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
    <stop offset="100%" stop-color="rgba(200,230,255,0.2)"/>
  </linearGradient>
  <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FAFAFA"/>
    <stop offset="100%" stop-color="#E8E8E8"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dx="2" dy="4" result="offsetblur"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Sky background (upper) -->
<rect x="0" y="0" width="1400" height="400" fill="url(#skyGrad)"/>
<!-- River view through window -->
<rect x="200" y="200" width="1000" height="300" fill="url(#riverGrad)" opacity="0.6"/>
<!-- Distant buildings/skyline -->
<g opacity="0.3" fill="#4A6A8A">
  <rect x="250" y="350" width="40" height="100"/>
  <rect x="300" y="320" width="50" height="130"/>
  <rect x="360" y="380" width="35" height="70"/>
  <rect x="900" y="330" width="55" height="120"/>
  <rect x="965" y="360" width="40" height="90"/>
  <rect x="1020" y="340" width="60" height="110"/>
  <rect x="1090" y="370" width="35" height="80"/>
</g>
<!-- River boats (small) -->
<ellipse cx="500" cy="440" rx="15" ry="4" fill="#FFF" opacity="0.6"/>
<ellipse cx="800" cy="420" rx="12" ry="3" fill="#FFF" opacity="0.5"/>

<!-- Window frame (grand south-facing 8.6m floor-to-ceiling window) -->
<rect x="180" y="180" width="1040" height="340" fill="url(#glassGrad)" stroke="#2A2A2E" stroke-width="6"/>
<!-- Window mullions (vertical) -->
<line x1="350" y1="180" x2="350" y2="520" stroke="#2A2A2E" stroke-width="3"/>
<line x1="520" y1="180" x2="520" y2="520" stroke="#2A2A2E" stroke-width="3"/>
<line x1="700" y1="180" x2="700" y2="520" stroke="#2A2A2E" stroke-width="3"/>
<line x1="880" y1="180" x2="880" y2="520" stroke="#2A2A2E" stroke-width="3"/>
<line x1="1050" y1="180" x2="1050" y2="520" stroke="#2A2A2E" stroke-width="3"/>
<!-- Horizontal transom at second floor slab level -->
<line x1="180" y1="340" x2="1220" y2="340" stroke="#2A2A2E" stroke-width="4"/>

<!-- Interior space: floor (wood) -->
<polygon points="100,520 1300,520 1350,850 50,850" fill="url(#floorGrad)"/>
<!-- Floor planks -->
<g stroke="#A08060" stroke-width="0.8" opacity="0.4">
  <line x1="80" y1="580" x2="1320" y2="580"/>
  <line x1="90" y1="640" x2="1310" y2="640"/>
  <line x1="100" y1="700" x2="1300" y2="700"/>
  <line x1="110" y1="760" x2="1290" y2="760"/>
  <line x1="120" y1="820" x2="1280" y2="820"/>
</g>

<!-- Left wall (white) -->
<polygon points="50,100 180,180 180,520 100,520 100,850 50,850" fill="url(#wallGrad)" stroke="#CCC" stroke-width="1"/>
<!-- Right wall -->
<polygon points="1350,100 1220,180 1220,520 1300,520 1300,850 1350,850" fill="url(#wallGrad)" stroke="#CCC" stroke-width="1"/>
<!-- Ceiling (white, partial) -->
<polygon points="50,100 700,50 1350,100 1220,180 700,140 180,180" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>

<!-- Stair on west wall (left side) -->
<g filter="url(#softShadow)">
  <!-- Stair stringer -->
  <polygon points="100,520 100,350 180,300 180,520" fill="#E8E5E0" stroke="#8B7355" stroke-width="2"/>
  <!-- Treads -->
  <g stroke="#8B7355" stroke-width="1.5">
    <line x1="100" y1="520" x2="180" y2="520"/>
    <line x1="100" y1="500" x2="173" y2="500"/>
    <line x1="100" y1="480" x2="166" y2="480"/>
    <line x1="100" y1="460" x2="159" y2="460"/>
    <line x1="100" y1="440" x2="152" y2="440"/>
    <line x1="100" y1="420" x2="145" y2="420"/>
    <line x1="100" y1="400" x2="138" y2="400"/>
    <line x1="100" y1="380" x2="131" y2="380"/>
  </g>
  <!-- Railing/handrail -->
  <line x1="180" y1="300" x2="180" y2="520" stroke="#4A4A4A" stroke-width="3"/>
  <text x="120" y="560" font-size="11" fill="#5A4A3A" font-family="'PingFang SC',sans-serif">侧边L型折返楼梯</text>
</g>

<!-- Second floor bridge/gallery visible above (glass railing) -->
<g>
  <!-- Bridge floor slab -->
  <rect x="180" y="320" width="350" height="20" fill="#E0E0E0" stroke="#999" stroke-width="1"/>
  <!-- Glass railing on bridge -->
  <rect x="180" y="250" width="350" height="70" fill="rgba(180,220,255,0.25)" stroke="#4A90D9" stroke-width="2"/>
  <!-- Railing posts -->
  <g fill="#4A90D9">
    <circle cx="200" cy="285" r="3"/>
    <circle cx="280" cy="285" r="3"/>
    <circle cx="360" cy="285" r="3"/>
    <circle cx="440" cy="285" r="3"/>
    <circle cx="510" cy="285" r="3"/>
  </g>
  <text x="350" y="240" font-size="10" fill="#4A90D9" text-anchor="middle" font-family="'PingFang SC',sans-serif">二层桥廊·玻璃护栏</text>
</g>

<!-- Grey modular sofa in living room -->
<g filter="url(#softShadow)">
  <rect x="480" y="580" width="340" height="100" rx="12" fill="#B8BCC4" stroke="#6D717D" stroke-width="2"/>
  <rect x="480" y="565" width="80" height="20" rx="5" fill="#A8ACB4" stroke="#6D717D"/>
  <rect x="740" y="565" width="80" height="20" rx="5" fill="#A8ACB4" stroke="#6D717D"/>
  <!-- Cushions -->
  <rect x="500" y="590" width="60" height="30" rx="8" fill="#C8CCD4"/>
  <rect x="580" y="590" width="60" height="30" rx="8" fill="#C8CCD4"/>
  <rect x="660" y="590" width="60" height="30" rx="8" fill="#C8CCD4"/>
</g>

<!-- Coffee table -->
<rect x="590" y="700" width="120" height="50" rx="4" fill="#8B7355" stroke="#5A4A3A" stroke-width="2" filter="url(#softShadow)"/>
<rect x="600" y="695" width="100" height="8" fill="#A08060"/>

<!-- Round dining table (visible in midground) -->
<ellipse cx="850" cy="620" rx="60" ry="25" fill="#E8E5E0" stroke="#8B7355" stroke-width="2" filter="url(#softShadow)"/>
<ellipse cx="850" cy="615" rx="50" ry="20" fill="none" stroke="#B8A898" stroke-width="1"/>
<!-- Dining chairs (simplified) -->
<g fill="#D4C8BC" stroke="#8B7355" stroke-width="1">
  <rect x="825" y="575" width="20" height="20" rx="4"/>
  <rect x="875" y="575" width="20" height="20" rx="4"/>
  <rect x="825" y="645" width="20" height="20" rx="4"/>
  <rect x="875" y="645" width="20" height="20" rx="4"/>
</g>
<text x="850" y="680" font-size="9" fill="#FF8A80" text-anchor="middle" font-family="'PingFang SC',sans-serif">伊塔视频固定餐位</text>

<!-- Kitchen island visible on left/back -->
<rect x="200" y="430" width="180" height="60" rx="4" fill="#F0E8DF" stroke="#B8A898" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="290" y="465" font-size="9" fill="#6D717D" text-anchor="middle" font-family="'PingFang SC',sans-serif">中岛</text>

<!-- Fishing floor lamp -->
<line x1="460" y1="750" x2="460" y2="620" stroke="#5A4A3A" stroke-width="3"/>
<circle cx="460" cy="610" r="20" fill="#FFD166" opacity="0.4"/>
<circle cx="460" cy="610" r="12" fill="#FFF8E0" opacity="0.7"/>

<!-- Bookshelf on right wall -->
<rect x="1150" y="400" width="50" height="350" fill="#E8E5E0" stroke="#8B7355" stroke-width="1.5"/>
<g stroke="#B8A898" stroke-width="1">
  <line x1="1150" y1="450" x2="1200" y2="450"/>
  <line x1="1150" y1="500" x2="1200" y2="500"/>
  <line x1="1150" y1="550" x2="1200" y2="550"/>
  <line x1="1150" y1="600" x2="1200" y2="600"/>
  <line x1="1150" y1="650" x2="1200" y2="650"/>
  <line x1="1150" y1="700" x2="1200" y2="700"/>
</g>
<!-- Books (colorful) -->
<g>
  <rect x="1155" y="420" width="8" height="28" fill="#4A90D9"/>
  <rect x="1165" y="425" width="7" height="23" fill="#FF8A80"/>
  <rect x="1175" y="418" width="9" height="30" fill="#7AB87A"/>
  <rect x="1186" y="422" width="6" height="26" fill="#FFD166"/>
  <circle cx="1175" cy="530" r="7" fill="#FF8A80" opacity="0.8"/>
</g>

<!-- Pendant lights over island -->
<line x1="260" y1="140" x2="260" y2="410" stroke="#333" stroke-width="1"/>
<line x1="340" y1="140" x2="340" y2="410" stroke="#333" stroke-width="1"/>
<ellipse cx="260" cy="415" rx="15" ry="8" fill="#FFD166" opacity="0.6"/>
<ellipse cx="340" cy="415" rx="15" ry="8" fill="#FFD166" opacity="0.6"/>

<!-- Second floor studio glimpse (upper left) -->
<rect x="580" y="260" width="200" height="60" fill="#FFFFFF" opacity="0.7" stroke="#999"/>
<text x="680" y="295" font-size="9" fill="#333" text-anchor="middle" font-family="'PingFang SC',sans-serif">二层设计工作室</text>

<!-- Master bedroom glimpse (upper right) -->
<rect x="900" y="260" width="200" height="60" fill="#FFF5F4" opacity="0.7" stroke="#DDD"/>
<text x="1000" y="295" font-size="9" fill="#333" text-anchor="middle" font-family="'PingFang SC',sans-serif">江景主卧</text>

<!-- Title -->
<text x="700" y="70" font-size="28" fill="#1A1A1E" text-anchor="middle" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">伊塔 132㎡ 江景复式 · 整体空间透视</text>
<text x="700" y="95" font-size="13" fill="#6D717D" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">侧边L型折返楼梯 · 8.6m通高落地窗 · 二层桥廊挑空 · 南北通透江景</text>

<!-- Annotation arrows/labels -->
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#333">
  <line x1="140" y1="420" x2="60" y2="400" stroke="#666" stroke-width="1"/>
  <text x="20" y="395" text-anchor="start">L型折返楼梯</text>
  <text x="20" y="408" text-anchor="start" fill="#666">贴西侧墙布置</text>
  
  <line x1="700" y1="340" x2="700" y2="180" stroke="#666" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="720" y="220">二层楼板 @2.85m</text>
  
  <line x1="700" y1="520" x2="700" y2="180" stroke="#4A90D9" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="720" y="350" fill="#4A90D9">通高4.3m落地窗</text>
</g>

</svg>