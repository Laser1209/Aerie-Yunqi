# Aerie · 云栖 — MCP server 连接配置（core/mcp_client.py）
#
# 默认关闭：`enabled: false` 时 MCPClientManager.start() 不建立任何连接，
# 也不会向 ToolRegistry 注册任何工具，现有启动行为完全不变。
# 只有顶层和某个 server 同时 `enabled: true` 才会真正拉起子进程 / 建立外连。
#
# 支持的 transport：
#   stdio       本地子进程，行分隔 JSON-RPC
#   http        远程 Streamable HTTP（每个 JSON-RPC 消息一次 POST；响应可为
#               单 JSON 或 SSE 流；服务端可能下发 Mcp-Session-Id）
#
# 字段说明：
#   command              可执行文件（stdio）
#   args                 参数列表（stdio）
#   url                  远端端点（http）
#   headers              请求头（http）；值支持 ${VAR} 引用环境变量
#   env                  追加/覆盖的环境变量（stdio）；值同样支持 ${VAR}
#   cwd                  子进程工作目录（可省略）
#   timeout_seconds      initialize / tools/list 超时（秒，默认 30）
#   call_timeout_seconds tools/call 超时（秒，默认 120）
#
# 密钥一律用 ${VAR} 引用，不要写进本文件 —— 它会被提交进版本库。
# 引用名必须与设置页「平台凭证」写入 .env 的环境变量名一致，否则用户在界面上
# 填完密钥、这里却读不到，表现为"显示已配置但用不了"。
#
# 远端工具注册名规则：mcp__<server>__<远端工具名>
# 与既有工具同名时跳过并告警，绝不覆盖已有工具。

enabled: false

servers:
  # 示例：JustOneAPI MCP（本仓库 justoneapi-mcp/ 子项目，stdio 方式）
  # 启用步骤：顶层 enabled 改 true → 本项 enabled 改 true → 填好 token
  justoneapi:
    enabled: false
    transport: stdio
    command: npx
    args: ["-y", "justoneapi-mcp"]
    env: {}
    # env:
    #   JUSTONEAPI_TOKEN: "<your token>"
    timeout_seconds: 30
    call_timeout_seconds: 120

  # Notion —— 选社区维护的 notion-mcp-server（stdio + 个人访问令牌）而不是官方托管版。
  #
  # 为什么不用官方 `https://mcp.notion.com/mcp`：那个端点**只支持 OAuth 2.0 + PKCE**，
  # 必须有人点"授权"，而后端进程无法做到；官方另有一个开源 stdio server，但它按
  # 每个 API 端点生成一个工具，启动即灌入约 17,163 tokens 的 schema。
  # notion-mcp-server 用静态令牌，工具 schema 约 1,005 tokens，适合无人工介入的后端。
  #
  # 令牌获取：https://app.notion.com/developers/tokens → New token → 复制 ntn_…
  # 同样可在设置页「平台凭证 → Notion」填写（写 .env + os.environ）。
  notion:
    enabled: false
    transport: stdio
    command: npx
    args: ["-y", "notion-mcp-server"]
    env:
      NOTION_TOKEN: "${NOTION_TOKEN}"
    timeout_seconds: 60
    call_timeout_seconds: 120

  # 天眼查 —— 官方远程 MCP（Streamable HTTP）。
  # 令牌获取：https://open.tianyancha.com/ → 申请接口权限 → 取 Token
  # 同样可在设置页「平台凭证 → 天眼查」填写。
  tianyancha:
    enabled: false
    transport: http
    url: "https://mcp.tianyancha.com/v1"
    headers:
      Authorization: "Bearer ${TIANYAN_TOKEN}"
    timeout_seconds: 30
    call_timeout_seconds: 120
