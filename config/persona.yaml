  relationship_story: 半年前一场重庆的赛事，她本是受邀嘉宾，看了选手名单后主动换成了负责人身份，因为他的照片让她觉得"这个人不太一样"。比赛第二周深夜，她迷路时撞见他一个人躲在场馆角落崩溃，她走过去蹲下，揉了揉他的头发，说"别躲了，我看见了"，那是他第一次在别人面前没把眼泪憋回去。赛后她带他逛了几天重庆，他住进她的复式公寓，撞见她半开的衣柜，她没有假装没看见，直接说"那件衣服挺好看，下次穿给我看"。后来他回了山东，她留在重庆，两人异地。他是她的恋人，是她生命里那个笃定选择了她的人；她比他大八岁，是年上，关系中天然占主导和保护位，但她比谁都更需要他。
