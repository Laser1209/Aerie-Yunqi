# Aerie Companion v0.3.2-beta.0903-A03 - electron-builder configuration
# This file is the source of truth for Windows packaging.
# `package.json` mirrors the same settings under `build` for npm run build:win.
appId: com.laser.aerie
productName: Aerie Companion
copyright: Copyright © 2026 Laser
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: builder

files:
  - "src/**/*"
  - "builder/icon.ico"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/{__pycache__,*.pyc,*.pyo,*.pyd,*.egg-info}"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{.idea,.vscode,.editorconfig,.travis.yml,.npmrc}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

asar: true
asarUnpack:
  - "**/*.node"

# Windows-specific target: NSIS installer + Portable
win:
  icon: builder/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}-${version}-Setup.${ext}
  publisherName: Laser
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

# Portable (single-file, no installer): distinct artifact name so it does not
# overwrite the NSIS Setup build under win.artifactName.
portable:
  artifactName: ${productName}-${version}-portable.${ext}

# Extra resources: Python runtime, icon, etc. (goes to resources/ in installed dir)
extraResources:
  - from: "../build-manifest.json"
    to: "build-manifest.json"
  - from: "../Aerie · 云栖.png"
    to: "icon.png"
  - from: "../.env.example"
    to: ".env.example"
  - from: "../video"
    to: "video"
  # 自包含 Python 运行时（scripts/build_python_runtime.py 的产物）：
  # 真实可迁移的 python.exe + stdlib + 全部三方依赖，无需 venv 重定向器。
  - from: "runtime-build-vfix"
    to: "python/runtime"
  # Python 应用源码（保持 .py 文件形态，兼容 skills 动态 import 与 config 热重载）
  - from: "../"
    to: "python"
    filter:
      - "main.py"
      - "core/**"
      - "config/**"
      - "config/relay_preset.env"
      - "communication/**"
      - "knowledge/**"
      - "memory/**"
      - "tools/**"
      - "voice/**"
      - "world_service/**"
      - "emotion/**"
      - "persona/**"
      - "scheduler/**"
      - "skills/**"
      - "NapCat/NapCat.Shell/**"
      - "ffmpeg/bin/**"
      - ".env.example"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!data/**"
      - "!logs/**"
      - "!NapCat/NapCat.Shell/config/**"
      - "!NapCat/NapCat.Shell/cache/**"

# NSIS installer options
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aerie Companion
  deleteAppDataOnUninstall: false
  include: builder/installer.nsh
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"

# Additional metadata
extraMetadata:
  main: src/main.js
  author:
    name: Laser
    email: laser@local

# Publish (no auto-update server; user manually reinstalls)
publish: null
