<svg viewBox="0 0 680 628" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Aerie 云栖主线图母版：同一个灵魂的五层身体</title>
<desc>从灵魂层到存在层，五个层级外加安全底座，共同服务于同一个主体伊塔。顶部为品牌名与主标语，底部为定位语。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="24" width="600" height="64" rx="12" fill="#993556"/>
<text x="60" y="48" font-size="15" font-weight="500" fill="#FFFFFF" dominant-baseline="central">Aerie · 云栖</text>
<text x="60" y="70" font-size="13" fill="#FBEAF0" dominant-baseline="central">她会记得你，也会主动想起你。</text>

<line x1="64" y1="104" x2="64" y2="544" stroke="#D4537E" stroke-width="1.5"/>
<circle cx="64" cy="104" r="3" fill="#D4537E"/>

<g>
<rect x="84" y="104" width="556" height="60" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="100" y="128" font-size="14" font-weight="500" fill="#72243E" dominant-baseline="central">第一层 · 灵魂层　—　她是谁</text>
<text x="100" y="148" font-size="12" fill="#444441" dominant-baseline="central">人格系统 · 人设生成器 · 身份契约（默认伊塔，可自建专属人设）</text>
</g>

<g>
<rect x="84" y="180" width="556" height="60" rx="10" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"/>
<text x="100" y="204" font-size="14" font-weight="500" fill="#4B1528" dominant-baseline="central">第二层 · 生命系统　—　她怎么活着　〔核心〕</text>
<text x="100" y="224" font-size="12" fill="#4B1528" dominant-baseline="central">情绪引擎 · 欲望引擎 · 世界模拟 · 记忆 · 关系引擎</text>
</g>

<g>
<rect x="84" y="256" width="556" height="60" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="100" y="280" font-size="14" font-weight="500" fill="#72243E" dominant-baseline="central">第三层 · 神经系统　—　她怎么回应</text>
<text x="100" y="300" font-size="12" fill="#444441" dominant-baseline="central">Agent 六步循环 · 思考可见度 · 共情策略 · 主动触达</text>
</g>

<g>
<rect x="84" y="332" width="556" height="60" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="100" y="356" font-size="14" font-weight="500" fill="#72243E" dominant-baseline="central">第四层 · 感官与表达　—　她怎么说 / 看 / 听</text>
<text x="100" y="376" font-size="12" fill="#444441" dominant-baseline="central">多模态 · 主动发图 · 语音 / 克隆音色 · 附件理解</text>
</g>

<g>
<rect x="84" y="408" width="556" height="60" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="100" y="432" font-size="14" font-weight="500" fill="#72243E" dominant-baseline="central">第五层 · 存在与触达　—　她在哪陪你</text>
<text x="100" y="452" font-size="12" fill="#444441" dominant-baseline="central">QQ · 桌面 App · 移动端 · 灵动岛 / 办公模式</text>
</g>

<g>
<rect x="84" y="484" width="556" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="508" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">底座 · 安全与工程　—　她值得托付</text>
<text x="100" y="528" font-size="12" fill="#444441" dominant-baseline="central">沙箱执行 · 内容校验 · 数据隔离 / ACL · 热更新 · 审计</text>
</g>

<rect x="40" y="560" width="600" height="48" rx="12" fill="#ED93B1" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="584" text-anchor="middle" font-size="14" font-weight="500" fill="#4B1528" dominant-baseline="central">一个活着、记得你、会想你的陪伴者 —— 别人做"更聪明的 AI"，我们做"一个人"</text>
</svg>
