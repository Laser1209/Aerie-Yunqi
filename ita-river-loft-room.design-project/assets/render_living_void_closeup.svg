<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" style="background:linear-gradient(180deg,#E8F4FC 0%,#D4B896 50%,#B8986A 100%);">
<defs>
  <linearGradient id="skyLV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5B9BD5"/><stop offset="50%" stop-color="#9DC3E6"/><stop offset="100%" stop-color="#E8F4FC"/></linearGradient>
  <linearGradient id="riverLV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A90D9"/><stop offset="100%" stop-color="#2A5A8A"/></linearGradient>
  <linearGradient id="floorLV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D4B896"/><stop offset="100%" stop-color="#B8986A"/></linearGradient>
  <linearGradient id="glassLV" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(200,230,255,0.35)"/><stop offset="50%" stop-color="rgba(255,255,255,0.15)"/><stop offset="100%" stop-color="rgba(200,230,255,0.25)"/></linearGradient>
  <linearGradient id="wallLV" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F0F0F0"/><stop offset="100%" stop-color="#E0E0E0"/></linearGradient>
  <filter id="shLV"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="3" dy="5" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Sky -->
<rect x="0" y="0" width="1400" height="380" fill="url(#skyLV)"/>
<!-- River -->
<rect x="100" y="200" width="1200" height="200" fill="url(#riverLV)" opacity="0.7"/>
<!-- Far bank -->
<path d="M100,280 Q400,260 700,275 Q1000,290 1300,270 L1300,200 L100,200 Z" fill="#3A6A3A" opacity="0.4"/>
<!-- Distant buildings -->
<g opacity="0.3" fill="#5A7A9A">
  <rect x="200" y="230" width="35" height="50"/><rect x="250" y="210" width="45" height="70"/><rect x="310" y="240" width="30" height="40"/>
  <rect x="900" y="220" width="50" height="60"/><rect x="965" y="235" width="35" height="45"/><rect x="1020" y="215" width="55" height="65"/><rect x="1090" y="245" width="30" height="35"/>
</g>

<!-- Title -->
<text x="700" y="40" font-size="26" fill="#1A1A1E" text-anchor="middle" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">通高江景客厅 + 挑空桥廊特写</text>
<text x="700" y="65" font-size="12" fill="#FFF" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">25.5㎡通高挑空 · 8.6m×4.3m落地大窗 · 二层玻璃栏杆俯瞰 · 灰色模块沙发</text>

<!-- Floor-to-ceiling window frame -->
<rect x="80" y="120" width="1240" height="400" fill="url(#glassLV)" stroke="#1A1A1E" stroke-width="8"/>
<!-- Vertical mullions -->
<g stroke="#1A1A1E" stroke-width="3">
  <line x1="230" y1="120" x2="230" y2="520"/><line x1="400" y1="120" x2="400" y2="520"/>
  <line x1="700" y1="120" x2="700" y2="520"/><line x1="1000" y1="120" x2="1000" y2="520"/>
  <line x1="1170" y1="120" x2="1170" y2="520"/>
</g>
<!-- Second floor slab transom -->
<line x1="80" y1="290" x2="1320" y2="290" stroke="#1A1A1E" stroke-width="5"/>

<!-- Interior walls (sides) -->
<polygon points="0,0 80,120 80,520 40,520 40,900 0,900" fill="url(#wallLV)"/>
<polygon points="1400,0 1320,120 1320,520 1360,520 1360,900 1400,900" fill="url(#wallLV)"/>

<!-- Ceiling visible -->
<polygon points="0,0 700,20 1400,0 1320,120 700,90 80,120" fill="#FAFAFA"/>
<!-- Ceiling light cove glow -->
<rect x="200" y="80" width="1000" height="20" fill="#FFF8E0" opacity="0.4"/>

<!-- Second floor bridge/overlook with glass railing (visible above) -->
<g>
  <!-- Slab -->
  <rect x="80" y="270" width="400" height="20" fill="#D0D0D0" stroke="#888" stroke-width="1"/>
  <!-- Glass panels -->
  <rect x="80" y="190" width="400" height="80" fill="rgba(180,220,255,0.3)" stroke="#4A90D9" stroke-width="2"/>
  <!-- Metal handrail on top -->
  <line x1="80" y1="188" x2="480" y2="188" stroke="#C0C0C0" stroke-width="4"/>
  <!-- Glass support posts -->
  <g fill="#4A90D9">
    <rect x="100" y="190" width="3" height="80"/><rect x="180" y="190" width="3" height="80"/>
    <rect x="260" y="190" width="3" height="80"/><rect x="340" y="190" width="3" height="80"/>
    <rect x="420" y="190" width="3" height="80"/><rect x="470" y="190" width="3" height="80"/>
  </g>
  <text x="280" y="175" font-size="11" fill="#4A90D9" text-anchor="middle" font-family="'PingFang SC',sans-serif">二层桥廊·玻璃护栏·俯瞰客厅</text>
</g>

<!-- Wood floor (interior) -->
<polygon points="40,520 1360,520 1360,900 40,900" fill="url(#floorLV)"/>
<g stroke="#A08060" stroke-width="0.8" opacity="0.35">
  <line x1="50" y1="580" x2="1350" y2="580"/><line x1="60" y1="640" x2="1340" y2="640"/>
  <line x1="70" y1="700" x2="1330" y2="700"/><line x1="80" y1="760" x2="1320" y2="760"/>
  <line x1="90" y1="820" x2="1310" y2="820"/><line x1="100" y1="880" x2="1300" y2="880"/>
</g>

<!-- Grey modular sofa (facing window/river) -->
<g filter="url(#shLV)">
  <rect x="350" y="580" width="500" height="120" rx="16" fill="#B8BCC4" stroke="#6D717D" stroke-width="2"/>
  <rect x="350" y="560" width="100" height="25" rx="6" fill="#A8ACB4" stroke="#6D717D"/>
  <rect x="750" y="560" width="100" height="25" rx="6" fill="#A8ACB4" stroke="#6D717D"/>
  <!-- Back modules -->
  <rect x="370" y="585" width="120" height="50" rx="8" fill="#A8ACB4"/>
  <rect x="500" y="585" width="120" height="50" rx="8" fill="#A8ACB4"/>
  <rect x="630" y="585" width="120" height="50" rx="8" fill="#A8ACB4"/>
  <!-- Throw pillows -->
  <rect x="390" y="590" width="40" height="35" rx="8" fill="#FF8A80" opacity="0.7"/>
  <rect x="700" y="590" width="40" height="35" rx="8" fill="#4A90D9" opacity="0.6"/>
</g>

<!-- Coffee table -->
<rect x="500" y="720" width="180" height="60" rx="6" fill="#5A4A3A" stroke="#3A2A1A" stroke-width="2" filter="url(#shLV)"/>
<rect x="510" y="715" width="160" height="8" fill="#8B7355"/>
<!-- Books/magazines on table -->
<rect x="525" y="700" width="40" height="18" fill="#FFF" stroke="#CCC"/>
<rect x="580" y="703" width="35" height="15" fill="#FFD166" opacity="0.7"/>
<!-- Vase -->
<ellipse cx="640" cy="710" rx="8" ry="12" fill="#E8E5E0" stroke="#AAA"/>

<!-- Bookshelf wall (left interior wall) -->
<rect x="90" y="130" width="50" height="380" fill="#E8E5E0" stroke="#8B7355" stroke-width="1.5"/>
<g stroke="#B8A898" stroke-width="1">
  <line x1="90" y1="190" x2="140" y2="190"/><line x1="90" y1="250" x2="140" y2="250"/>
  <line x1="90" y1="320" x2="140" y2="320"/><line x1="90" y1="390" x2="140" y2="390"/>
  <line x1="90" y1="460" x2="140" y2="460"/>
</g>
<!-- Books on shelves -->
<g>
  <rect x="95" y="155" width="8" height="32" fill="#4A90D9"/><rect x="105" y="160" width="7" height="27" fill="#FF8A80"/>
  <rect x="114" y="152" width="9" height="35" fill="#7AB87A"/><rect x="125" y="158" width="6" height="29" fill="#FFD166"/>
  <!-- User's hanging ornament on second shelf from top, center -->
  <circle cx="115" cy="280" r="9" fill="#FF8A80" opacity="0.9" stroke="#C0504D" stroke-width="1"/>
  <line x1="115" y1="250" x2="115" y2="271" stroke="#C0504D" stroke-width="1"/>
  <text x="160" y="285" font-size="8" fill="#FF8A80" font-family="'PingFang SC',sans-serif">用户送的挂件</text>
  <rect x="95" y="355" width="7" height="32" fill="#6B5B95"/><rect x="104" y="360" width="8" height="27" fill="#88B04B"/>
  <rect x="115" y="352" width="7" height="35" fill="#F7CAC9"/><rect x="124" y="358" width="6" height="29" fill="#92A8D1"/>
</g>
<text x="115" y="525" font-size="9" fill="#5A4A3A" text-anchor="middle" font-family="'PingFang SC',sans-serif">通顶书柜墙</text>

<!-- Fishing floor lamp (next to sofa left) -->
<g filter="url(#shLV)">
  <line x1="330" y1="820" x2="330" y2="620" stroke="#5A4A3A" stroke-width="4"/>
  <path d="M330,620 Q400,580 420,600" stroke="#5A4A3A" stroke-width="3" fill="none"/>
  <circle cx="425" cy="600" r="22" fill="#FFD166" opacity="0.35"/>
  <circle cx="425" cy="600" r="14" fill="#FFF8E0" opacity="0.8"/>
  <!-- Base -->
  <ellipse cx="330" cy="825" rx="20" ry="6" fill="#3A2A1A"/>
</g>
<text x="330" y="850" font-size="9" fill="#5A4A3A" text-anchor="middle" font-family="'PingFang SC',sans-serif">钓鱼灯</text>

<!-- Balcony/reading nook visible through glass door at right -->
<rect x="1200" y="400" width="120" height="120" fill="rgba(120,180,120,0.2)" stroke="#7AB87A" stroke-width="1"/>
<rect x="1210" y="460" width="40" height="50" fill="#D4C8BC" stroke="#8B7355" stroke-width="1" rx="4"/>
<circle cx="1270" cy="470" r="15" fill="#7AB87A" opacity="0.7"/>
<text x="1260" y="535" font-size="8" fill="#5A7A5A" text-anchor="middle" font-family="'PingFang SC',sans-serif">阳台阅读角·单椅绿植</text>

<!-- Rug under seating area -->
<ellipse cx="600" cy="750" rx="320" ry="100" fill="#E8E5E0" opacity="0.5" stroke="#CCC" stroke-width="1"/>

<!-- Annotations -->
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#FFF" stroke="#000" stroke-width="0.5" paint-order="stroke">
  <line x1="280" y1="280" x2="200" y2="120" stroke="#FFF" stroke-width="1.5"/>
  <text x="180" y="110" text-anchor="end">二层玻璃护栏/桥廊</text>
  <line x1="700" y1="520" x2="700" y2="120" stroke="#FFD166" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="720" y="300" fill="#FFD166">4.3m通高落地窗</text>
</g>

</svg>